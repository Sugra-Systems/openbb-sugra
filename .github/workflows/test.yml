name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '.gitignore'
      - '**/*.md'
      - 'assets/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff pytest
      - name: Ruff
        run: ruff check openbb_sugra tests
      - name: Pytest (structural; the live gate skips without SUGRA_TEST_API_KEY)
        run: pytest -q
      - name: Provider registration check
        run: |
          python -c "
          import openbb_sugra
          from openbb_core.app.provider_interface import ProviderInterface
          p = openbb_sugra.sugra_provider
          valid = set(ProviderInterface().map.keys())
          unknown = [k for k in p.fetcher_dict if k not in valid]
          assert not unknown, f'unknown standard-model keys: {unknown}'
          print(f'OK: sugra provider, {len(p.fetcher_dict)} fetchers, all keys valid')
          "
      - name: Clone OpenBB v5 source
        if: matrix.python-version == '3.12'
        # Pinned: the upstream v5 branch was merged into develop and deleted.
        run: |
          git init -q .tmp/OpenBB-v5
          git -C .tmp/OpenBB-v5 fetch -q --depth 1 https://github.com/OpenBB-finance/OpenBB.git 0aa603953221f0f6fbcfeb985e2d3d124c61e873
          git -C .tmp/OpenBB-v5 checkout -q FETCH_HEAD
      - name: Pytest against OpenBB v5 source overlay
        if: matrix.python-version == '3.12'
        run: python scripts/run_v5_overlay_tests.py --openbb-path .tmp/OpenBB-v5 -- -q
