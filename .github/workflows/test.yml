name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - '.github/workflows/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.gitignore'
      - '**/*.md'
      - 'assets/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff pytest
      - name: Ruff
        run: ruff check openbb_sugra tests
      - name: Pytest (structural; the live gate skips without SUGRA_TEST_API_KEY)
        run: pytest -q
      - name: Provider registration check
        run: |
          python -c "
          import openbb_sugra
          from openbb_core.app.provider_interface import ProviderInterface
          p = openbb_sugra.sugra_provider
          valid = set(ProviderInterface().map.keys())
          unknown = [k for k in p.fetcher_dict if k not in valid]
          assert not unknown, f'unknown standard-model keys: {unknown}'
          print(f'OK: sugra provider, {len(p.fetcher_dict)} fetchers, all keys valid')
          "
